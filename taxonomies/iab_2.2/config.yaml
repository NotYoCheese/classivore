name: "IAB Content Taxonomy"
version: "2.2"
slug: "iab-2.2"

# Taxonomy structure
taxonomy_file: "taxonomy.csv"
enriched_file: "taxonomy_enriched.csv"
id_column: "id"
name_column: "name"
parent_column: "parent_id"
description_column: null  # Will be populated by enrichment

# Tier columns (optional, for display)
tier_columns: ["tier1", "tier2", "tier3", "tier4"]

# Classification settings
classification_type: "multi_label"
max_labels: 3
min_confidence: 0.5

# Training settings
model_base: "microsoft/deberta-v3-large"
batch_size: 8
learning_rate: 2.0e-5
max_length: 512
num_epochs: 3
focal_loss:
  alpha: 0.75
  gamma: 3.5
class_weight_cap: 7.0

# Enrichment settings
enrichment:
  model: "claude-haiku-4-5-20251001"
  max_tokens_per_category: 150

# Collection settings
collection:
  target_per_category: 7
  max_queries_per_category: 6
  max_per_domain_per_category: 50
  commoncrawl_crawl_id: "CC-MAIN-2026-08"
  query_model: "claude-haiku-4-5-20251001"

# Data collection hints
domain_hints:
  Automotive:
    - "caranddriver.com"
    - "motortrend.com"
    - "autoblog.com"
  Technology & Computing:
    - "techcrunch.com"
    - "arstechnica.com"
    - "theverge.com"

# Categories to skip during data expansion
excluded_categories:
  - "Music and Audio: Soft AC Music"
  - "Music and Audio: Adult Album Alternative"
  - "Music and Audio: Urban AC Music"
  - "Movies: World Movies"
  - "Television: World TV"
  - "Real Estate: Developmental Sites"
  - "Music and Audio: Classic Hits"
  - "Business and Finance: Large Business"
  - "Style & Fashion: Bath and Shower"
  - "Music and Audio: Variety (Music and Audio)"
